      <div class="row">
        <button class="btn primary" data-go="lessons">Empezar las lecciones</button>
        <button class="btn" data-go="simIntro">Presentar el simulacro</button>
      </div>
      <div class="stats">
        <div class="stat"><b>${done}/10</b><span>lecciones practicadas</span></div>
        <div class="stat"><b>${best != null ? best : "–"}</b><span>mejor puntaje en simulacro</span></div>
        <div class="stat"><b>${hist.length}</b><span>simulacros presentados</span></div>
      </div>
    </div>
    <aside class="sheet" aria-label="Así se ve una hoja de respuestas">
      <h3>Hoja de respuestas</h3>
      ${sheet}
      <p class="muted" style="font-size:13.5px;margin:12px 0 0">Las instrucciones de la prueba están en español; las preguntas y los textos, en inglés. Aquí practicarás igual.</p>
    </aside>
  </section>

    <div class="path"><span class="step">2</span><h3>Practica</h3><p>10 preguntas por lección con retroalimentación inmediata: sabrás por qué acertaste o te equivocaste.</p></div>

  </section>

/* ---------- Lista de lecciones ---------- */
function viewLessons(){
  return `
  <h1>Lecciones</h1>
  <p class="muted" style="max-width:70ch">Cada lección tiene una explicación en español y una práctica de 10 preguntas. Te recomendamos seguirlas en orden: las tres primeras corresponden a las partes 1, 2 y 3; las siguientes cubren la gramática y la lectura de las partes 4 a 7.</p>
  <div class="lesson-grid">
  ${LESSONS.map(l => {
    const b = prog[l.id];
    return `<button class="lcard" data-act="openLesson" data-id="${l.id}">
      <div class="top"><span class="lnum">${l.id}</span><span class="tag">${l.tag}</span></div>
      <h3>${l.title}</h3>
      <p>${l.desc}</p>
      <div class="lprog"><span class="bar"><i style="width:${b != null ? b * 10 : 0}%"></i></span><span>${b != null ? `Mejor: ${b}/10` : "Sin practicar"}</span></div>
    </button>`;
  }).join("")}
  </div>`;
}

/* ---------- Lección ---------- */
function curLesson(){ return LESSONS.find(l => l.id === state.id); }

function viewLesson(){
  const l = curLesson();
  const tab = state.tab || "teoria";
  let body;
  if (tab === "teoria"){
    body = `<article class="theory">${l.theory}</article>
    <div class="row" style="margin-top:20px"><button class="btn primary" data-act="tab" data-tab="practica">Ir a la práctica de 10 preguntas</button></div>`;
  } else body = viewPractice(l);
  return `
  <button class="crumb" data-go="lessons">‹ Todas las lecciones</button>
  <div class="lhead"><span class="lnum">${l.id}</span><div><span class="tag">${l.tag}</span><h1 style="margin-top:6px">${l.title}</h1><p class="muted" style="margin:0">${l.desc}</p></div></div>
  <div class="tabs" role="tablist">
    <button role="tab" class="${tab === "teoria" ? "on" : ""}" data-act="tab" data-tab="teoria">Explicación</button>
    <button role="tab" class="${tab === "practica" ? "on" : ""}" data-act="tab" data-tab="practica">Práctica</button>
  </div>
  ${body}`;
}

function passageHTML(p, open){
  return `<details class="passage" ${open ? "open" : ""}><summary>Texto: ${esc(p.title)}</summary><div style="margin-top:10px">${p.body.map(x => `<p>${esc(x)}</p>`).join("")}</div></details>`;
}

function stemHTML(q, fallbackAsk){
  let h = "";
  if (q.sign) h += `<div class="sign">${esc(q.sign)}</div><p class="qtext">${q.q ? gapify(q.q) : "Where can you see this notice?"}</p>`;
  else if (q.say) h += `<div class="dialog"><div class="bubble a"><b>A:</b>${esc(q.say)}</div><div class="bubble b"><b>B:</b>…</div></div><p class="qtext" style="font-size:16px">${fallbackAsk}</p>`;
  else h += `<p class="qtext">${gapify(q.q)}</p>`;
  return h;
}

function viewPractice(l){
  if (!state.pr) state.pr = { i: 0, ans: [], fb: [] };
  const pr = state.pr, n = l.qs.length;
  const dots = l.qs.map((q, k) => {
    const a = pr.ans[k];
    const c = a == null ? (k === pr.i ? "cur" : "") : (a === q.a ? "ok" : "bad");
    return `<i class="${c}"></i>`;
  }).join("");
  if (pr.i >= n) return viewSummary(l, dots);
  const q = l.qs[pr.i], ch = pr.ans[pr.i], answered = ch != null;
  const opts = q.o.map((o, k) => {
    let cls = "";
    if (answered){ if (k === q.a) cls = "correct"; else if (k === ch) cls = "wrong"; }
    return `<button class="opt ${cls}" data-act="lans" data-i="${k}" ${answered ? "disabled" : ""}><span class="lt">${LET[k]}</span><span>${esc(o)}</span></button>`;
  }).join("");
  let fb = "";
  if (answered){
    const ok = ch === q.a;
    fb = `<div class="fb ${ok ? "ok" : "bad"}" role="status"><h4>${pr.fb[pr.i]}</h4>
      ${ok ? "" : `<p>La respuesta correcta es <b>${LET[q.a]}. ${esc(q.o[q.a])}</b></p>`}
      <p>${q.e}</p></div>
      <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn primary" data-act="lnext">${pr.i === n - 1 ? "Ver mis resultados" : "Siguiente pregunta"}</button></div>`;
  }
  const passage = q.p ? passageHTML(l.passages[q.p], true) : "";
  return `<div class="practice">
    <div class="dots" aria-hidden="true">${dots}</div>
    ${passage}
    <div class="qcard">
      <div class="qmeta">Pregunta ${pr.i + 1} de ${n}${!q.say && !q.sign ? " · " + esc(l.ask) : ""}</div>
      ${stemHTML(q, l.ask)}
      <div class="opts">${opts}</div>
      ${fb}
    </div>
  </div>`;
}

function viewSummary(l, dots){
  const pr = state.pr;
  const score = l.qs.filter((q, k) => pr.ans[k] === q.a).length;
  let msg;
  if (score === 10) msg = "¡Dominio total de esta lección! Estás listo para el siguiente tema.";
  else if (score >= 8) msg = "Muy buen trabajo. Repasa las preguntas que fallaste y continúa.";
  else if (score >= 6) msg = "Vas por buen camino. Te conviene releer la explicación de los puntos que fallaste.";
  else msg = "Te recomendamos volver a la explicación y repetir la práctica. ¡Con práctica se mejora!";
  const wrong = l.qs.map((q, k) => ({ q, k })).filter(x => pr.ans[x.k] !== x.q.a);
  const next = LESSONS.find(x => x.id === l.id + 1);
  return `<div class="practice">
    <div class="dots" aria-hidden="true">${dots}</div>
    <div class="summary">
      <div class="big-score">${score}<span style="font-size:24px;color:var(--muted)">/10</span></div>
      <p style="font-size:17px;margin-top:10px">${msg}</p>
      ${wrong.length ? `<h3 style="margin-top:20px">Preguntas para repasar</h3>` + wrong.map(({ q, k }) => `<div class="mistake"><b>${k + 1}.</b> ${esc(q.sign || q.say || q.q)}<br><span class="c">Correcta: ${esc(q.o[q.a])}</span> <span class="muted">(elegiste: ${esc(q.o[pr.ans[k]])})</span></div>`).join("") : ""}
      <div class="row" style="margin-top:22px">
        <button class="btn" data-act="lretry">Repetir la práctica</button>
        <button class="btn ghost" data-act="tab" data-tab="teoria">Repasar la explicación</button>
        ${next ? `<button class="btn primary" data-act="openLesson" data-id="${next.id}">Siguiente lección</button>` : `<button class="btn accent" data-go="simIntro">Ir al simulacro</button>`}
      </div>
    </div>
  </div>`;
}

/* ---------- Simulacro: intro ---------- */
function viewSimIntro(){
  const running = sim && sim.endAt > Date.now();
  const counts = PARTS.map(p => [p, FLAT.filter(f => SIM[f.si].part === p).length]);
  return `
  <h1>Simulacro Saber TyT: inglés</h1>
  <div class="intro">
    <div class="panel">
      <div class="facts">
        <div class="fact"><b>${TOTAL}</b><span>preguntas</span></div>
        <div class="fact"><b>60</b><span>minutos</span></div>

      </div>
      <h3>Antes de empezar</h3>
      <ul class="rules">
        <li>El simulacro incluye las 7 partes del módulo, en el mismo orden de la prueba.</li>

        <li>No verás si aciertas mientras respondes, igual que en la prueba real.</li>
        <li>Cuando el tiempo llegue a cero, el simulacro se entrega automáticamente.</li>
        <li>Al final verás tu puntaje sobre 100, tu desempeño por parte y la corrección de cada pregunta.</li>
      </ul>
      <div class="row" style="margin-top:16px">
        ${running ? `<button class="btn primary" data-act="simResume">Continuar el simulacro en curso</button><button class="btn ghost" data-act="simRestart">Empezar uno nuevo</button>` : `<button class="btn primary" data-act="simStart">Iniciar simulacro</button>`}
      </div>
    </div>
    <div class="panel">
      <h3>Distribución de preguntas</h3>
      <div class="hist">${counts.map(([p, c]) => `<div><span>Parte ${p}: ${partName(p)}</span><b>${c}</b></div>`).join("")}</div>
      ${hist.length ? `<h3 style="margin-top:22px">Tus intentos</h3><div class="hist">${hist.slice(-5).reverse().map(h => `<div><span>${new Date(h.date).toLocaleDateString("es-CO", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</span><b>${h.score}/100</b></div>`).join("")}</div>
      ${LS.get("tyt_last", null) ? `<button class="btn sm" style="margin-top:14px" data-act="lastRes">Ver la revisión del último intento</button>` : ""}` : ""}
    </div>
  </div>`;
}

function newSim(){
  const now = Date.now();
  sim = { answers: Array(TOTAL).fill(null), flags: Array(TOTAL).fill(false), cur: 0, startAt: now, endAt: now + SIM_MS, showNav: false };
  LS.set("tyt_sim", sim); lastSec = -1;
  go("sim");
}

/* ---------- Simulacro: vista ---------- */
function fmtTime(ms){ const s = Math.ceil(ms / 1000); const m = Math.floor(s / 60); return `${String(m).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }

function clozeHTML(sec, curGlobal){
  const txt = esc(sec.text).replace(/\{(\d+)\}/g, (m, d) => {
    const g = sec.start + Number(d);
    const a = sim.answers[g];
    const it = sec.items[Number(d)];
    const cls = ["gap", a != null ? "filled" : "", g === curGlobal ? "cur" : ""].join(" ");
    return `<span class="${cls}" data-act="snav" data-i="${g}" role="button" tabindex="0">(${g + 1}) ${a != null ? esc(it.o[a]) : "______"}</span>`;
  });
  return `<h4>${esc(sec.title)}</h4><p>${txt}</p>`;
}
function readingHTML(sec){ return `<h4>${esc(sec.passage.title)}</h4>${sec.passage.body.map(p => `<p>${esc(p)}</p>`).join("")}`; }

function viewSim(){
  const f = FLAT[sim.cur], sec = SIM[f.si], it = sec.items[f.ii];
  const answered = sim.answers.filter(x => x != null).length;
  const left = Math.max(0, sim.endAt - Date.now());
  const opts = optsOf(sec, it);
  const ch = sim.answers[sim.cur];
  let stem = "";
  if (sec.kind === "bank") stem = `<div class="bankbox">Tema: <b>${esc(sec.title)}</b>. Cada palabra (A–H) se usa una sola vez; sobran tres.</div><p class="qtext">${esc(it.q)}</p>`;
  else if (sec.kind === "sign") stem = `<div class="sign">${esc(it.sign)}</div><p class="qtext">Where can you see this notice?</p>`;
  else if (sec.kind === "dialog") stem = `<div class="dialog"><div class="bubble a"><b>A:</b>${esc(it.say)}</div><div class="bubble b"><b>B:</b>…</div></div>`;
  else if (sec.kind === "cloze") stem = `<p class="qtext">Choose the correct word for gap (${f.n}).</p>`;
  else stem = `<p class="qtext">${esc(it.q)}</p>`;
  const optHTML = `<div class="opts ${opts.length > 4 ? "two" : ""}">${opts.map((o, k) => `<button class="opt ${ch === k ? "sel" : ""}" data-act="sans" data-i="${k}"><span class="lt">${LET[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  const q = `<div class="qcard"><div class="qmeta">Pregunta ${f.n} de ${TOTAL}${sim.flags[sim.cur] ? " · marcada para revisar" : ""}</div>${stem}${optHTML}
    <div class="simnav">
      <button class="btn" data-act="sprev" ${sim.cur === 0 ? "disabled" : ""}>‹ Anterior</button>
      <button class="btn flagbtn ${sim.flags[sim.cur] ? "on" : ""}" data-act="sflag">${sim.flags[sim.cur] ? "Quitar marca" : "Marcar para revisar"}</button>
      ${sim.cur === TOTAL - 1 ? `<button class="btn accent" data-act="sfinish">Finalizar</button>` : `<button class="btn primary" data-act="snext">Siguiente ›</button>`}
    </div></div>`;
  const hasText = sec.kind === "cloze" || sec.kind === "reading";
  const main = hasText ? `<div class="split"><div class="textpanel" id="tp">${sec.kind === "cloze" ? clozeHTML(sec, sim.cur) : readingHTML(sec)}</div><div>${q}</div></div>` : `<div style="max-width:760px">${q}</div>`;
  const nav = sim.showNav ? `<div class="navpanel">${PARTS.map(p => `<div class="navpart"><small>Parte ${p}: ${partName(p)}</small><div class="navgrid">${FLAT.filter(x => SIM[x.si].part === p).map(x => { const g = x.n - 1; return `<button data-act="snav" data-i="${g}" class="${sim.answers[g] != null ? "ans" : ""} ${g === sim.cur ? "cur" : ""} ${sim.flags[g] ? "flg" : ""}" aria-label="Pregunta ${x.n}">${x.n}</button>`; }).join("")}</div></div>`).join("")}
    <div class="legend"><span><i class="a"></i>Respondida</span><span><i></i>Sin responder</span><span><i class="f"></i>Marcada</span></div></div>` : "";
  return `
  <div class="simbar">
    <div class="timer ${left <= 5 * 60000 ? "danger" : left <= 10 * 60000 ? "warn" : ""}" id="timerBox" aria-live="off"><span aria-hidden="true">⏱</span><span id="timer">${fmtTime(left)}</span></div>
    <div class="simprog"><small>${answered} de ${TOTAL} respondidas</small><div class="bar"><i style="width:${answered / TOTAL * 100}%"></i></div></div>
    <button class="btn sm" data-act="stoggle">${sim.showNav ? "Ocultar preguntas" : "Ver todas las preguntas"}</button>
    <button class="btn sm accent" data-act="sfinish">Finalizar</button>
  </div>
  ${nav}
  <div class="sechead"><span class="tag">Parte ${sec.part}</span><h2 style="margin-top:6px">${sec.name}</h2><p>${sec.instr}</p></div>
  ${main}`;
}

function rerenderSim(){
  const tp = $("#tp"), st = tp ? tp.scrollTop : 0;
  const prev = lastSec;
  render();
  const cur = FLAT[sim.cur].si;
  const tp2 = $("#tp");
  if (tp2){
    if (prev === cur) tp2.scrollTop = st;
    const g = tp2.querySelector(".gap.cur");
    if (g){
      const top = g.offsetTop - tp2.offsetTop;
      if (top < tp2.scrollTop + 20 || top > tp2.scrollTop + tp2.clientHeight - 40) tp2.scrollTop = Math.max(0, top - 60);
    }
  }
  if (prev !== cur) window.scrollTo(0, 0);
  lastSec = cur;
}

function startTimer(){
  lastSec = FLAT[sim.cur].si;
  timerInt = setInterval(() => {
    const left = sim.endAt - Date.now();
    const el = $("#timer"), box = $("#timerBox");
    if (el){ el.textContent = fmtTime(Math.max(0, left)); box.classList.toggle("warn", left <= 10 * 60000 && left > 5 * 60000); box.classList.toggle("danger", left <= 5 * 60000); }
    if (left <= 0) finishSim(true);
  }, 1000);
}

function finishSim(auto){
  clearInterval(timerInt); timerInt = null;
  const used = Math.min(SIM_MS, Date.now() - sim.startAt);
  const res = { answers: sim.answers.slice(), used, date: Date.now(), auto };
  const sc = scoreOf(res.answers);
  hist.push({ score: sc.score, date: res.date }); LS.set("tyt_hist", hist);
  LS.set("tyt_last", res); LS.del("tyt_sim"); sim = null;
  state = { view: "results", res, filter: "wrong" };
  render(); window.scrollTo(0, 0);
  if (auto) modal({ title: "Se acabó el tiempo", body: "El simulacro se entregó automáticamente con las respuestas que alcanzaste a marcar.", ok: "Ver resultados", cancel: null });
}

/* ---------- Resultados ---------- */
function scoreOf(answers){
  let correct = 0, blank = 0;
  FLAT.forEach((f, g) => { const it = SIM[f.si].items[f.ii]; if (answers[g] == null) blank++; else if (answers[g] === it.a) correct++; });
  return { correct, blank, wrong: TOTAL - correct - blank, score: Math.round(correct / TOTAL * 100) };
}
function levelOf(s){
  if (s >= 91) return ["B+", "Supera el nivel B1"];
  if (s >= 76) return ["B1", "Usuario independiente"];
  if (s >= 56) return ["A2", "Usuario básico"];
  if (s >= 36) return ["A1", "Usuario básico inicial"];
  return ["A-", "Por debajo de A1"];
}
function clozeSentence(sec, ii){
  const t = sec.text.replace(/\{(\d+)\}/g, (m, d) => Number(d) === ii ? "@@" : "___");
  const pos = t.indexOf("@@");
  let s = t.lastIndexOf(". ", pos); s = s < 0 ? 0 : s + 2;
  let e = t.indexOf(". ", pos); e = e < 0 ? t.length : e + 1;
  return esc(t.slice(s, e)).replace("@@", `<span class="gapline"></span>`).replace(/___/g, "___");
}

function viewResults(){
  const res = state.res;
  const sc = scoreOf(res.answers);
  const [lv, lvTxt] = levelOf(sc.score);
  const R = 72, C = 2 * Math.PI * R, off = C * (1 - sc.score / 100);
  const color = sc.score >= 76 ? "var(--ok)" : sc.score >= 56 ? "var(--primary)" : sc.score >= 36 ? "var(--accent)" : "var(--bad)";
  let msg;
  if (sc.score >= 91) msg = "¡Resultado sobresaliente! Tu dominio del inglés está por encima de lo que exige la prueba.";
  else if (sc.score >= 76) msg = "¡Muy buen resultado! Revisa tus errores para consolidar lo aprendido.";
  else if (sc.score >= 56) msg = "Buen avance. Identifica las partes con menor puntaje y repasa las lecciones relacionadas.";
  else if (sc.score >= 36) msg = "Vas construyendo bases. Te recomendamos repasar las lecciones y volver a intentarlo.";
  else msg = "Este es tu punto de partida. Estudia las lecciones con calma y vuelve a presentar el simulacro.";
  const parts = PARTS.map(p => {
    const idx = FLAT.map((f, g) => ({ f, g })).filter(x => SIM[x.f.si].part === p);
    const c = idx.filter(x => res.answers[x.g] === SIM[x.f.si].items[x.f.ii].a).length;
    return { p, c, t: idx.length };
  });
  const filter = state.filter || "wrong";
  const items = FLAT.map((f, g) => ({ f, g, sec: SIM[f.si], it: SIM[f.si].items[f.ii] })).filter(x => {
    const a = res.answers[x.g];
    if (filter === "wrong") return a !== x.it.a;
    if (filter === "ok") return a === x.it.a;
    return true;
  });
  const rev = items.map(({ f, g, sec, it }) => {
    const a = res.answers[g], ok = a === it.a, opts = optsOf(sec, it);
    let stem = "";
    if (sec.kind === "bank") stem = `<div class="q">${esc(it.q)}</div>`;
    else if (sec.kind === "sign") stem = `<div class="sign">${esc(it.sign)}</div><div class="q">Where can you see this notice?</div>`;
    else if (sec.kind === "dialog") stem = `<div class="q">A: ${esc(it.say)}<br>B: …</div>`;
    else if (sec.kind === "cloze") stem = `<div class="q" style="font-family:var(--serif);font-weight:400;font-size:16.5px">${clozeSentence(sec, f.ii)}</div>`;
    else stem = `<div class="q"><span class="muted" style="font-weight:500">Texto "${esc(sec.passage.title)}":</span> ${esc(it.q)}</div>`;
    return `<div class="rev ${a == null ? "blank" : ok ? "ok" : "bad"}">
      <div class="h"><span>Pregunta ${f.n} · Parte ${sec.part}</span><span>${a == null ? "Sin responder" : ok ? "Correcta" : "Incorrecta"}</span></div>
      ${stem}
      ${a == null ? `<div class="ans y">No respondiste esta pregunta.</div>` : ok ? "" : `<div class="ans y">Tu respuesta: ${LET[a]}. ${esc(opts[a])}</div>`}
      <div class="ans c">Respuesta correcta: ${LET[it.a]}. ${esc(opts[it.a])}</div>
      <div class="exp">${it.e}</div>
    </div>`;
  }).join("");
  const mins = Math.floor(res.used / 60000), secs = Math.round(res.used % 60000 / 1000);
  return `
  <h1>Resultados del simulacro</h1>
  <section class="res-top">
    <div class="ring">
      <svg width="170" height="170" viewBox="0 0 170 170" aria-hidden="true"><circle cx="85" cy="85" r="${R}" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="85" cy="85" r="${R}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
      <div class="val"><div><b>${sc.score}</b><span>de 100 puntos</span></div></div>
    </div>
    <div>
      <p style="font-size:18px;font-weight:600;margin-bottom:6px">${msg}</p>
      <div class="chips"><span class="chip ok">${sc.correct} correctas</span><span class="chip bad">${sc.wrong} incorrectas</span><span class="chip">${sc.blank} sin responder</span><span class="chip">Tiempo: ${mins} min ${secs} s</span></div>
      <span class="level">Nivel estimado: ${lv} (${lvTxt})</span>
      <p class="muted" style="font-size:13px;margin:8px 0 0">El nivel es orientativo y se calcula con base en este simulacro; no equivale al resultado oficial del ICFES.</p>
    </div>
  </section>
  <section class="byparts">
    <h3>Desempeño por parte</h3>
    ${parts.map(x => `<div class="pbar"><span>Parte ${x.p}: ${partName(x.p)}</span><span class="bar"><i style="width:${x.c / x.t * 100}%"></i></span><b>${x.c}/${x.t}</b></div>`).join("")}
  </section>
  <div class="row"><button class="btn primary" data-act="simStart">Presentar otro simulacro</button><button class="btn" data-go="lessons">Repasar las lecciones</button></div>
  <h2 style="margin-top:30px">Revisión de preguntas</h2>
  <div class="filters">
    <button class="btn sm ${filter === "wrong" ? "primary" : ""}" data-act="rfilter" data-f="wrong">Incorrectas y sin responder (${sc.wrong + sc.blank})</button>
    <button class="btn sm ${filter === "ok" ? "primary" : ""}" data-act="rfilter" data-f="ok">Correctas (${sc.correct})</button>
    <button class="btn sm ${filter === "all" ? "primary" : ""}" data-act="rfilter" data-f="all">Todas (${TOTAL})</button>
  </div>
  ${rev || `<p class="muted">No hay preguntas en esta categoría. ¡Excelente!</p>`}`;
}

/* ---------- Acciones ---------- */
app.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  const act = t.dataset.act;
  switch (act){
    case "openLesson": state = { view: "lesson", id: Number(t.dataset.id), tab: "teoria" }; render(); window.scrollTo(0, 0); break;
    case "tab": state.tab = t.dataset.tab; render(); window.scrollTo(0, 0); break;
    case "lans": {
      const l = curLesson(), pr = state.pr, k = Number(t.dataset.i);
      if (pr.ans[pr.i] != null) break;
      pr.ans[pr.i] = k; pr.fb[pr.i] = k === l.qs[pr.i].a ? pick(POS) : pick(NEG);
      render(); const fb = $(".fb"); if (fb) fb.scrollIntoView({ block: "nearest", behavior: "smooth" }); break;
    }
    case "lnext": {
      const l = curLesson(), pr = state.pr; pr.i++;
      if (pr.i >= l.qs.length){ const s = l.qs.filter((q, k) => pr.ans[k] === q.a).length; prog[l.id] = Math.max(prog[l.id] ?? 0, s); LS.set("tyt_prog", prog); }
      render(); window.scrollTo(0, 0); break;
    }
    case "lretry": state.pr = { i: 0, ans: [], fb: [] }; state.tab = "practica"; render(); window.scrollTo(0, 0); break;
    case "simStart": newSim(); break;
    case "simRestart": modal({ title: "¿Empezar un simulacro nuevo?", body: "Se descartará el simulacro que tienes en curso y sus respuestas.", ok: "Empezar de nuevo", danger: true, onOk: () => { LS.del("tyt_sim"); sim = null; newSim(); } }); break;
    case "simResume": if (sim && sim.endAt > Date.now()) go("sim"); else if (sim) finishSim(true); break;
    case "lastRes": state = { view: "results", res: LS.get("tyt_last", null), filter: "wrong" }; render(); window.scrollTo(0, 0); break;
    case "sans": sim.answers[sim.cur] = Number(t.dataset.i); LS.set("tyt_sim", sim); rerenderSim(); break;
    case "snext": if (sim.cur < TOTAL - 1){ sim.cur++; LS.set("tyt_sim", sim); rerenderSim(); } break;
    case "sprev": if (sim.cur > 0){ sim.cur--; LS.set("tyt_sim", sim); rerenderSim(); } break;
    case "snav": sim.cur = Number(t.dataset.i); LS.set("tyt_sim", sim); rerenderSim(); break;
    case "sflag": sim.flags[sim.cur] = !sim.flags[sim.cur]; LS.set("tyt_sim", sim); rerenderSim(); break;
    case "stoggle": sim.showNav = !sim.showNav; LS.set("tyt_sim", sim); rerenderSim(); break;
    case "sfinish": {
      const blank = sim.answers.filter(x => x == null).length, flg = sim.flags.filter(Boolean).length;
      const extra = [blank ? `Tienes <b>${blank}</b> pregunta${blank > 1 ? "s" : ""} sin responder.` : "Respondiste todas las preguntas.", flg ? `Hay <b>${flg}</b> marcada${flg > 1 ? "s" : ""} para revisar.` : ""].join(" ");
      modal({ title: "¿Finalizar el simulacro?", body: `${extra} Una vez finalices no podrás cambiar tus respuestas.`, ok: "Finalizar y ver resultados", cancel: "Seguir respondiendo", onOk: () => finishSim(false) });
      break;
    }
    case "rfilter": state.filter = t.dataset.f; render(); break;
  }
});
app.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches(".gap[data-act]")){ e.preventDefault(); e.target.click(); } });

/* ---------- Inicio ---------- */
if (sim && sim.endAt <= Date.now()){ finishSim(true); } else render();
</script>
</body></html>
